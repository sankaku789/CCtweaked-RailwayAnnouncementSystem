name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Check Lua syntax
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | xargs -0 -n1 luac5.2 -p

      - name: Load scheduler module
        run: |
          lua5.2 -e 'package.path="./src/?.lua;" .. package.path; require("core.client.scheduler")'

      - name: Test departure scheduler
        run: |
          lua5.2 tests/departure_scheduler_test.lua

      - name: Test guidance state
        run: |
          lua5.2 tests/guidance_state_test.lua

      - name: Test guidance server timing
        run: |
          lua5.2 tests/guidance_server_timing_test.lua
